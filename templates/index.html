<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Heart Disease Detection System</h1>

        <form action="/predict" method="post">

    <input type="number" name="age" placeholder="Age" required>
    <input type="number" name="sex" placeholder="Sex (0=F,1=M)" required>
    <input type="number" name="cp" placeholder="Chest Pain Type (0-3)" required>
    <input type="number" name="trestbps" placeholder="Resting Blood Pressure" required>
    <input type="number" name="chol" placeholder="Cholesterol" required>
    <input type="number" name="fbs" placeholder="Fasting Blood Sugar (0/1)" required>
    <input type="number" name="restecg" placeholder="Rest ECG (0-2)" required>
    <input type="number" name="thalach" placeholder="Max Heart Rate" required>
    <input type="number" name="exang" placeholder="Exercise Induced Angina (0/1)" required>
    <input type="number" step="0.01" name="oldpeak" placeholder="ST Depression" required>
    <input type="number" name="slope" placeholder="Slope (0-2)" required>
    <input type="number" name="ca" placeholder="Major Vessels (0-3)" required>
    <input type="number" name="thal" placeholder="Thal (1-3)" required>

    <button type="submit">Predict</button>
</form>


        {% if prediction_text %}
    <div class="result {% if 'High' in prediction_text %}high{% else %}low{% endif %}">
        {{ prediction_text }}
    </div>
{% endif %}

    </div>
</body>
</html>
